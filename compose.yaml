services:
  # ===== mysql-db (owner: Elena) =====
  mysql-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commute_db}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  # ===== mongo-db (owner: Lincoln) =====
  mongo-db:
    build: ./mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: analytics_db
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  # ===== auth-service (owner: Chenyue) =====
  auth-service:
    build: ./auth
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SEED_USERNAME: ${AUTH_SEED_USERNAME}
      AUTH_SEED_PASSWORD: ${AUTH_SEED_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks: [backend-net]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }

  # ===== enter-data-app (owner: Elena) =====
  post:
    build: ./post
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: commute_db
      AUTH_URL: http://auth-service:3000
    depends_on:
      mysql-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [frontend-net, backend-net]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  # ===== show-results-app (owner: Lincoln) =====
  show-results-app:
    build: ./get
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      MONGO_URI: ${MONGO_URI}
      AUTH_URL: http://auth-service:3000
      CACHE_TTL_MS: ${CACHE_TTL_MS:-0}
    depends_on:
      mongo-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [frontend-net, backend-net]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }

  # ===== analytics-service (owner: Taranjot Singh) =====
  analytics:
    build: ./analytics
    container_name: analytics-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: commute_db
      MONGO_URI: ${MONGO_URI}
      POLL_SECONDS: 15
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    networks: [backend-net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

networks:
  frontend-net:      # web apps only; they publish 8080/8081 to the host
    driver: bridge
  backend-net:       # web apps + auth + analytics + databases; no internet, no host ports
    internal: true

volumes:
  mysql-data:
  mongo-data: