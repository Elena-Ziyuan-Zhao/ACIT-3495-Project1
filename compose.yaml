services:
  # ===== mysql-db (owner: ___) =====
  mysql-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: commute_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  # ===== mongo-db (owner: Lincoln) =====
  mongo-db:
    build: ./mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: analytics_db
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  # ===== auth-service (owner: Chenyue) =====
  auth-service:
    build: ./auth
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SEED_USERNAME: ${AUTH_SEED_USERNAME}
      AUTH_SEED_PASSWORD: ${AUTH_SEED_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks: [backend-net]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }

  # ===== enter-data-app (owner: ___) =====

  # ===== show-results-app (owner: ___) =====

  # ===== analytics-service (owner: ___) =====

networks:
  frontend-net:      # web apps + auth-service; web apps publish 8080/8081
    driver: bridge
  backend-net:       # web apps + auth + analytics + databases; no internet, no host ports
    internal: true

volumes:
  mysql-data:
  mongo-data:
